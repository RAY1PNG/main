<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Colour Pop</title>
<style>
  :root {
    --bg: #17142a; --panel: #221e3a; --line: #3a3460; --text: #f3f0ff; --muted: #aba4cf;
    --accent: #ff8fb8; --accent-ink: #3d0a20;
    --c0: #ff6b6b; --c1: #ffd166; --c2: #4ecdc4; --c3: #7c9cff; --c4: #c38cff;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body { background: var(--bg); color: var(--text); font: 16px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; min-height: 100vh; }
  main { max-width: 480px; margin: 0 auto; padding: 16px 16px 40px; }
  h1 { font-size: 1.5rem; margin: 0; }
  h1 a { color: inherit; text-decoration: none; }
  button { font: inherit; color: var(--text); background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 7px 12px; cursor: pointer; touch-action: manipulation; }
  button.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); font-weight: 700; }
  button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .bar { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin: 12px 0; }
  .score { margin-left: auto; text-align: right; }
  .score b { font-size: 1.4rem; font-variant-numeric: tabular-nums; }
  .score span { display: block; color: var(--muted); font-size: 0.85rem; }
  .chips { display: flex; gap: 6px; }
  .chip { border-radius: 999px; padding: 4px 12px; font-size: 0.9rem; }
  .chip.on { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); font-weight: 600; }
  .grid { display: grid; gap: 3px; background: var(--panel); padding: 6px; border-radius: 14px; user-select: none; -webkit-user-select: none; }
  .tile { aspect-ratio: 1; border-radius: 6px; border: 0; padding: 0; min-width: 0; cursor: pointer; transition: transform 0.12s; }
  .tile.e { background: transparent; cursor: default; }
  .tile.hl { transform: scale(0.88); }
  .tile.c0 { background: var(--c0); } .tile.c1 { background: var(--c1); } .tile.c2 { background: var(--c2); }
  .tile.c3 { background: var(--c3); } .tile.c4 { background: var(--c4); }
  .msg { text-align: center; min-height: 1.6em; margin: 10px 0 0; font-weight: 700; }
  .hint { color: var(--muted); font-size: 0.9rem; text-align: center; margin: 8px 0 0; }
  @media (prefers-reduced-motion: reduce) { .tile { transition: none; } }
</style>
</head>
<body>
<main>
  <h1><a href="../" title="All games">🫧 Colour Pop</a></h1>
  <div class="bar">
    <button class="primary" id="newBtn">New game</button>
    <div class="chips" id="chips"></div>
    <div class="score"><b id="score">0</b><span id="best"></span></div>
  </div>
  <div class="grid" id="grid"></div>
  <p class="msg" id="msg" role="status"></p>
  <p class="hint">Tap a group of two or more touching tiles of the same colour to pop them. Bigger groups score a lot more. No timer, no rush.</p>
</main>
<script>
(function () {
  "use strict";
  var W = 8, H = 10, MODES = [[3, "Easy"], [4, "Normal"], [5, "Tricky"]];
  var colours = 4, grid = [], score = 0, hover = [];

  function $(id) { return document.getElementById(id); }
  function bestKey() { return "colourpop-best-" + colours; }
  function getBest() { try { return Number(localStorage.getItem(bestKey())) || 0; } catch (e) { return 0; } }
  function setBest(v) { try { localStorage.setItem(bestKey(), String(v)); } catch (e) {} }

  function newGame() {
    grid = [];
    for (var i = 0; i < W * H; i++) grid.push(Math.floor(Math.random() * colours));
    score = 0; hover = [];
    render();
  }

  function group(i) {
    var c = grid[i];
    if (c < 0) return [];
    var seen = {}, stack = [i], out = [];
    seen[i] = true;
    while (stack.length) {
      var k = stack.pop(); out.push(k);
      var x = k % W, y = Math.floor(k / W);
      [[x - 1, y], [x + 1, y], [x, y - 1], [x, y + 1]].forEach(function (p) {
        if (p[0] < 0 || p[0] >= W || p[1] < 0 || p[1] >= H) return;
        var n = p[1] * W + p[0];
        if (!seen[n] && grid[n] === c) { seen[n] = true; stack.push(n); }
      });
    }
    return out;
  }

  function settle() {
    var cols = [];
    for (var x = 0; x < W; x++) {
      var stack = [];
      for (var y = H - 1; y >= 0; y--) if (grid[y * W + x] >= 0) stack.push(grid[y * W + x]);
      if (stack.length) cols.push(stack);
    }
    for (var i = 0; i < W * H; i++) grid[i] = -1;
    cols.forEach(function (stack, x) { stack.forEach(function (c, k) { grid[(H - 1 - k) * W + x] = c; }); });
  }

  function anyMoves() {
    for (var i = 0; i < W * H; i++) {
      if (grid[i] < 0) continue;
      var x = i % W;
      if (x + 1 < W && grid[i + 1] === grid[i]) return true;
      if (i + W < W * H && grid[i + W] === grid[i]) return true;
    }
    return false;
  }

  function pop(i) {
    var g = group(i);
    if (g.length < 2) return;
    g.forEach(function (k) { grid[k] = -1; });
    score += g.length * (g.length - 1);
    settle(); hover = [];
    render();
  }

  function render() {
    var el = $("grid");
    el.style.gridTemplateColumns = "repeat(" + W + ", 1fr)";
    if (el.children.length !== W * H) {
      el.textContent = "";
      for (var i = 0; i < W * H; i++) {
        var b = document.createElement("button");
        b.type = "button"; b.dataset.i = i;
        el.appendChild(b);
      }
    }
    Array.prototype.forEach.call(el.children, function (b, i) {
      b.className = "tile " + (grid[i] < 0 ? "e" : "c" + grid[i]) + (hover.indexOf(i) >= 0 ? " hl" : "");
      b.disabled = grid[i] < 0;
      b.setAttribute("aria-label", grid[i] < 0 ? "Empty" : "Tile");
    });
    $("score").textContent = score;
    var left = grid.filter(function (c) { return c >= 0; }).length, msg = "";
    if (!anyMoves()) {
      var bonus = left === 0 ? 500 : 0;
      if (bonus && !render.bonused) { score += bonus; render.bonused = true; $("score").textContent = score; }
      if (score > getBest()) setBest(score);
      msg = left === 0 ? "✨ Board cleared! +500 bonus. Final score " + score : "No more pairs. Final score " + score + " (" + left + " tiles left)";
    } else render.bonused = false;
    $("msg").textContent = msg;
    var best = getBest();
    $("best").textContent = best ? "best " + best : "score";
    Array.prototype.forEach.call($("chips").children, function (b) { b.classList.toggle("on", Number(b.dataset.n) === colours); });
  }

  MODES.forEach(function (m) {
    var b = document.createElement("button");
    b.type = "button"; b.className = "chip"; b.dataset.n = m[0]; b.textContent = m[1];
    b.addEventListener("click", function () { colours = m[0]; newGame(); });
    $("chips").appendChild(b);
  });
  $("grid").addEventListener("click", function (e) { var t = e.target.closest(".tile"); if (t) pop(Number(t.dataset.i)); });
  $("grid").addEventListener("mouseover", function (e) {
    var t = e.target.closest(".tile"); var g = t ? group(Number(t.dataset.i)) : [];
    hover = g.length >= 2 ? g : []; render();
  });
  $("grid").addEventListener("mouseleave", function () { hover = []; render(); });
  $("newBtn").addEventListener("click", newGame);
  window.__colourPop = { grid: function () { return grid; }, score: function () { return score; }, pop: pop, group: group, anyMoves: anyMoves };
  newGame();
})();
</script>
</body>
</html>
