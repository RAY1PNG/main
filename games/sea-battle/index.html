<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sea Battle</title>
<style>
  :root {
    --bg: #0b1d2e;
    --panel: #12293f;
    --panel-2: #18344f;
    --line: #26486a;
    --text: #e8f1f8;
    --muted: #8fa9bf;
    --water: #1d4468;
    --water-hover: #2a5f8f;
    --ship: #9fb3c4;
    --hit: #e5533d;
    --sunk: #7a1f14;
    --miss: #0f2a42;
    --accent: #37c6b0;
    --accent-ink: #062b26;
    --warn: #f2b84b;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    background: var(--bg);
    color: var(--text);
    font: 16px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    min-height: 100vh;
  }
  main { max-width: 980px; margin: 0 auto; padding: 20px 16px 48px; }
  header { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
  h1 { font-size: 1.6rem; margin: 0; letter-spacing: 0.02em; }
  h2 { font-size: 1rem; margin: 0 0 8px; color: var(--muted); font-weight: 600; text-transform: uppercase; letter-spacing: 0.08em; }
  .room-tag { color: var(--muted); font-size: 0.9rem; }
  .room-tag b { color: var(--text); letter-spacing: 0.15em; }
  .panel { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 18px; margin-top: 16px; }
  .hidden { display: none !important; }
  button {
    font: inherit; color: var(--text); background: var(--panel-2);
    border: 1px solid var(--line); border-radius: 8px; padding: 9px 14px; cursor: pointer;
  }
  button:hover:not(:disabled) { border-color: var(--accent); }
  button:disabled { opacity: 0.45; cursor: not-allowed; }
  button.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); font-weight: 700; }
  input[type=text] {
    font: inherit; color: var(--text); background: var(--bg);
    border: 1px solid var(--line); border-radius: 8px; padding: 9px 12px; min-width: 0;
  }
  input[type=text]:focus, button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
  .lobby-choices { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
  .lobby-choices > div { background: var(--panel-2); border-radius: 10px; padding: 16px; }
  .lobby-choices p { margin: 0 0 12px; color: var(--muted); }
  #codeInput { width: 7.5em; text-transform: uppercase; letter-spacing: 0.2em; text-align: center; }
  .big-code { font-size: 2.4rem; font-weight: 800; letter-spacing: 0.3em; margin: 6px 0; }
  .status { font-size: 1.15rem; font-weight: 600; margin: 0; min-height: 1.6em; }
  .status.turn { color: var(--accent); }
  .status.wait { color: var(--muted); }
  .status.win { color: var(--accent); }
  .status.lose { color: var(--warn); }
  .note { color: var(--muted); font-size: 0.9rem; margin: 6px 0 0; }
  .error { color: var(--warn); margin: 10px 0 0; min-height: 1.4em; }

  .boards { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-top: 14px; }
  .board-wrap { min-width: 0; }
  .grid {
    display: grid; grid-template-columns: repeat(10, 1fr); gap: 2px;
    width: 100%; max-width: 440px; aspect-ratio: 1; user-select: none;
  }
  .cell {
    padding: 0; border: 0; border-radius: 3px; background: var(--water);
    position: relative; cursor: default; min-width: 0;
  }
  .grid.aim .cell.open { cursor: crosshair; }
  .grid.aim .cell.open:hover { background: var(--water-hover); }
  .grid.placing .cell { cursor: pointer; }
  .cell.ship { background: var(--ship); }
  .cell.preview { background: var(--accent); }
  .cell.bad { background: var(--warn); }
  .cell.miss { background: var(--miss); }
  .cell.miss::after {
    content: ""; position: absolute; inset: 38%; border-radius: 50%; background: var(--muted);
  }
  .cell.hit { background: var(--hit); }
  .cell.sunk { background: var(--sunk); }
  .cell.hit::after, .cell.sunk::after {
    content: "✕"; position: absolute; inset: 0; display: grid; place-items: center;
    color: #fff; font-size: 0.8rem; font-weight: 700;
  }
  .cell.revealed { background: var(--ship); opacity: 0.55; }
  .fleet { display: flex; gap: 8px; flex-wrap: wrap; margin: 10px 0 0; padding: 0; list-style: none; }
  .fleet li { background: var(--panel-2); border: 1px solid var(--line); border-radius: 999px; padding: 3px 12px; font-size: 0.9rem; }
  .fleet li.done { opacity: 0.4; text-decoration: line-through; }
  .fleet li.current { border-color: var(--accent); color: var(--accent); }

  .chat-log {
    height: 130px; overflow-y: auto; background: var(--bg); border: 1px solid var(--line);
    border-radius: 8px; padding: 8px 10px; font-size: 0.95rem;
  }
  .chat-log div { overflow-wrap: anywhere; }
  .chat-log .me { color: var(--accent); }
  .chat-log .sys { color: var(--muted); font-style: italic; }
  .chat-row { display: flex; gap: 8px; margin-top: 8px; }
  .chat-row input { flex: 1; }
  .emoji-row { display: flex; gap: 6px; margin-top: 8px; flex-wrap: wrap; }
  .emoji-row button { padding: 4px 10px; font-size: 1.1rem; }

  @media (max-width: 700px) {
    .lobby-choices, .boards { grid-template-columns: 1fr; }
    .grid { max-width: 100%; }
  }
</style>
</head>
<body>
<main>
  <header>
    <h1>⚓ Sea Battle</h1>
    <span class="room-tag hidden" id="roomTag">Room <b id="roomTagCode"></b></span>
  </header>

  <!-- Lobby -->
  <section class="panel" id="lobby">
    <div class="lobby-choices" id="lobbyChoices">
      <div>
        <h2>Start a game</h2>
        <p>Get a room code and send it to the other player.</p>
        <button class="primary" id="createBtn">Create room</button>
      </div>
      <div>
        <h2>Join a game</h2>
        <p>Type the code the other player sent you.</p>
        <div class="row">
          <input type="text" id="codeInput" maxlength="4" placeholder="CODE" autocomplete="off" aria-label="Room code">
          <button class="primary" id="joinBtn">Join</button>
        </div>
      </div>
    </div>
    <div id="waiting" class="hidden">
      <h2>Your room code</h2>
      <div class="big-code" id="bigCode"></div>
      <p class="note">Send this code to the other player. The game starts when they join. Keep this page open.</p>
      <div class="row" style="margin-top:12px"><button id="cancelBtn">Cancel</button></div>
    </div>
    <p class="error" id="lobbyMsg" role="status"></p>
  </section>

  <!-- Game -->
  <section id="game" class="hidden">
    <div class="panel">
      <p class="status" id="status" role="status"></p>
      <div class="row hidden" id="placeControls" style="margin-top:12px">
        <button id="rotateBtn">Rotate (R)</button>
        <button id="shuffleBtn">Place randomly</button>
        <button id="clearBtn">Clear</button>
        <button class="primary" id="readyBtn" disabled>Ready</button>
      </div>
      <div class="row hidden" id="overControls" style="margin-top:12px">
        <button class="primary" id="rematchBtn">Play again</button>
      </div>

      <div class="boards">
        <div class="board-wrap">
          <h2>Your waters</h2>
          <div class="grid" id="myGrid"></div>
          <ul class="fleet" id="myFleet"></ul>
        </div>
        <div class="board-wrap" id="enemyWrap">
          <h2>Their waters</h2>
          <div class="grid" id="enemyGrid"></div>
          <ul class="fleet" id="enemyFleet"></ul>
        </div>
      </div>
    </div>

    <div class="panel">
      <h2>Chat</h2>
      <div class="chat-log" id="chatLog" aria-live="polite"></div>
      <div class="chat-row">
        <input type="text" id="chatInput" maxlength="200" placeholder="Say something…" autocomplete="off" aria-label="Chat message">
        <button id="chatSend">Send</button>
      </div>
      <div class="emoji-row" id="emojiRow"></div>
    </div>
  </section>
</main>

<script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
<script>
(function () {
  "use strict";

  var SIZE = 10;
  var FLEET = [
    { name: "Carrier", len: 5 },
    { name: "Battleship", len: 4 },
    { name: "Cruiser", len: 3 },
    { name: "Submarine", len: 3 },
    { name: "Patrol boat", len: 2 }
  ];
  var PREFIX = "seabattle-room-";
  var CODE_CHARS = "ABCDEFGHJKMNPQRSTUVWXYZ";
  var EMOJIS = ["😂", "😱", "🎯", "🔥", "❤️", "😭", "👏"];
  // ?local in the address uses a same-computer link between two tabs (no internet), for trying it out.
  var LOCAL = new URLSearchParams(location.search).has("local");

  function $(id) { return document.getElementById(id); }

  // ---------- connection ----------
  var net = { peer: null, conn: null, chan: null, isHost: false, code: "", linked: false };

  function send(msg) {
    if (net.chan) net.chan.postMessage(msg);
    else if (net.conn && net.conn.open) net.conn.send(msg);
  }

  function makeCode() {
    var s = "";
    for (var i = 0; i < 4; i++) s += CODE_CHARS[Math.floor(Math.random() * CODE_CHARS.length)];
    return s;
  }

  function lobbyMsg(text) { $("lobbyMsg").textContent = text || ""; }

  function showWaiting(code) {
    $("lobbyChoices").classList.add("hidden");
    $("waiting").classList.remove("hidden");
    $("bigCode").textContent = code;
  }

  function resetLobby(message) {
    teardown();
    $("lobby").classList.remove("hidden");
    $("game").classList.add("hidden");
    $("roomTag").classList.add("hidden");
    $("lobbyChoices").classList.remove("hidden");
    $("waiting").classList.add("hidden");
    $("createBtn").disabled = false;
    $("joinBtn").disabled = false;
    lobbyMsg(message);
  }

  function teardown() {
    net.linked = false;
    if (net.chan) { try { net.chan.close(); } catch (e) {} }
    if (net.conn) { try { net.conn.close(); } catch (e) {} }
    if (net.peer) { try { net.peer.destroy(); } catch (e) {} }
    net.chan = null; net.conn = null; net.peer = null;
  }

  function onLinked() {
    if (net.linked) return;
    net.linked = true;
    $("lobby").classList.add("hidden");
    $("game").classList.remove("hidden");
    $("roomTag").classList.remove("hidden");
    $("roomTagCode").textContent = net.code;
    $("chatLog").textContent = "";
    sysLine("Connected. Place your ships!");
    newGame();
  }

  function onDropped() {
    if (!net.linked) return;
    resetLobby("The other player disconnected. Create or join a room to play again.");
  }

  function createRoom() {
    lobbyMsg("");
    $("createBtn").disabled = true;
    $("joinBtn").disabled = true;
    net.isHost = true;
    net.code = makeCode();
    if (LOCAL) {
      openChannel();
      showWaiting(net.code);
      return;
    }
    if (typeof Peer === "undefined") { resetLobby("Could not load the connection library. Check your internet and reload."); return; }
    lobbyMsg("Setting up the room…");
    net.peer = new Peer(PREFIX + net.code);
    net.peer.on("open", function () { lobbyMsg(""); showWaiting(net.code); });
    net.peer.on("connection", function (c) {
      if (net.conn) { c.close(); return; }
      wireConn(c);
    });
    net.peer.on("error", function (err) {
      if (err && err.type === "unavailable-id") { teardown(); createRoom(); return; }
      if (!net.linked) resetLobby("Could not create a room (" + (err && err.type || "network error") + "). Try again.");
    });
  }

  function joinRoom() {
    var code = $("codeInput").value.trim().toUpperCase();
    if (code.length !== 4) { lobbyMsg("Enter the 4-letter room code."); return; }
    $("createBtn").disabled = true;
    $("joinBtn").disabled = true;
    net.isHost = false;
    net.code = code;
    lobbyMsg("Joining room " + code + "…");
    if (LOCAL) {
      openChannel();
      net.chan.postMessage({ t: "hello" });
      setTimeout(function () { if (!net.linked) resetLobby("No room found with code " + code + "."); }, 1500);
      return;
    }
    if (typeof Peer === "undefined") { resetLobby("Could not load the connection library. Check your internet and reload."); return; }
    net.peer = new Peer();
    net.peer.on("open", function () {
      wireConn(net.peer.connect(PREFIX + code, { reliable: true }));
    });
    net.peer.on("error", function (err) {
      if (net.linked) return;
      if (err && err.type === "peer-unavailable") resetLobby("No room found with code " + code + ". Check the code and try again.");
      else resetLobby("Could not join (" + (err && err.type || "network error") + "). Try again.");
    });
  }

  function wireConn(c) {
    net.conn = c;
    c.on("open", onLinked);
    c.on("data", handle);
    c.on("close", onDropped);
    c.on("error", onDropped);
  }

  function openChannel() {
    net.chan = new BroadcastChannel(PREFIX + net.code);
    net.chan.onmessage = function (ev) {
      var m = ev.data;
      if (m.t === "hello") { if (net.isHost && !net.linked) { net.chan.postMessage({ t: "hello-ack" }); onLinked(); } return; }
      if (m.t === "hello-ack") { if (!net.isHost) onLinked(); return; }
      if (m.t === "bye") { onDropped(); return; }
      handle(m);
    };
    window.addEventListener("pagehide", function () { if (net.chan) net.chan.postMessage({ t: "bye" }); });
  }

  // ---------- game state ----------
  var g;

  function newGame() {
    g = {
      phase: "placing",          // placing | battle | over
      board: fill(-1),           // my ships: ship index per cell
      ships: [],                 // { cells: [], hits: 0 }
      incoming: fill(null),      // shots I received: 'hit' | 'miss'
      enemy: fill(null),         // shots I fired: 'hit' | 'miss' | 'sunk'
      enemySunk: 0,
      revealed: null,            // enemy ships shown after the game
      horizontal: true,
      hover: -1,
      meReady: false, themReady: false,
      myTurn: false, awaiting: false,
      won: null,
      meRematch: false, themRematch: false
    };
    render();
  }

  function fill(v) { var a = []; for (var i = 0; i < SIZE * SIZE; i++) a.push(v); return a; }

  function shipCells(start, len, horizontal) {
    var r = Math.floor(start / SIZE), c = start % SIZE, cells = [];
    for (var k = 0; k < len; k++) {
      var rr = horizontal ? r : r + k, cc = horizontal ? c + k : c;
      if (rr >= SIZE || cc >= SIZE) return null;
      cells.push(rr * SIZE + cc);
    }
    return cells;
  }

  function fits(cells) {
    if (!cells) return false;
    for (var i = 0; i < cells.length; i++) if (g.board[cells[i]] !== -1) return false;
    return true;
  }

  function placeShip(cells) {
    var idx = g.ships.length;
    cells.forEach(function (c) { g.board[c] = idx; });
    g.ships.push({ cells: cells, hits: 0 });
  }

  function clearShips() { g.board = fill(-1); g.ships = []; }

  function shuffleShips() {
    clearShips();
    FLEET.forEach(function (f) {
      for (;;) {
        var cells = shipCells(Math.floor(Math.random() * SIZE * SIZE), f.len, Math.random() < 0.5);
        if (fits(cells)) { placeShip(cells); break; }
      }
    });
  }

  // ---------- messages ----------
  function handle(m) {
    if (!m || typeof m.t !== "string" || !g) return;
    switch (m.t) {
      case "ready":
        g.themReady = true;
        maybeStart();
        render();
        break;
      case "start":
        if (g.phase === "placing" && g.meReady) begin(m.first === "guest");
        break;
      case "shot":
        receiveShot(m.i);
        break;
      case "result":
        receiveResult(m);
        break;
      case "reveal":
        if (g.phase === "over" && Array.isArray(m.cells)) { g.revealed = m.cells; render(); }
        break;
      case "rematch":
        g.themRematch = true;
        if (g.phase === "over" && !g.meRematch) sysLine("They want to play again.");
        maybeRematch();
        break;
      case "chat":
        if (typeof m.text === "string") chatLine("Them: " + m.text.slice(0, 200), "");
        break;
    }
  }

  function maybeStart() {
    if (!net.isHost || g.phase !== "placing" || !g.meReady || !g.themReady) return;
    var hostFirst = Math.random() < 0.5;
    send({ t: "start", first: hostFirst ? "host" : "guest" });
    begin(hostFirst);
  }

  function begin(iGoFirst) {
    g.phase = "battle";
    g.myTurn = iGoFirst;
    sysLine(iGoFirst ? "Battle on. You shoot first." : "Battle on. They shoot first.");
    render();
  }

  function fire(i) {
    if (g.phase !== "battle" || !g.myTurn || g.awaiting || g.enemy[i]) return;
    g.awaiting = true;
    send({ t: "shot", i: i });
    render();
  }

  function receiveShot(i) {
    if (g.phase !== "battle" || g.myTurn || !Number.isInteger(i) || i < 0 || i >= SIZE * SIZE || g.incoming[i]) return;
    var s = g.board[i], sunk = null, over = false;
    if (s >= 0) {
      g.incoming[i] = "hit";
      var ship = g.ships[s];
      ship.hits++;
      if (ship.hits === ship.cells.length) {
        sunk = ship.cells;
        over = g.ships.every(function (x) { return x.hits === x.cells.length; });
      }
    } else {
      g.incoming[i] = "miss";
    }
    send({ t: "result", i: i, hit: s >= 0, sunk: sunk, over: over });
    if (over) finish(false);
    else { g.myTurn = true; render(); }
  }

  function receiveResult(m) {
    if (g.phase !== "battle" || !g.awaiting) return;
    g.awaiting = false;
    g.enemy[m.i] = m.hit ? "hit" : "miss";
    if (Array.isArray(m.sunk)) {
      m.sunk.forEach(function (c) { g.enemy[c] = "sunk"; });
      g.enemySunk++;
      sysLine("You sank one of their ships!");
    }
    if (m.over) {
      var left = [];
      g.ships.forEach(function (s) { if (s.hits < s.cells.length) left = left.concat(s.cells); });
      send({ t: "reveal", cells: left });
      finish(true);
    } else {
      g.myTurn = false;
      render();
    }
  }

  function finish(won) {
    g.phase = "over";
    g.won = won;
    g.myTurn = false;
    sysLine(won ? "You won this round!" : "They won this round.");
    render();
  }

  function maybeRematch() {
    if (g.phase === "over" && g.meRematch && g.themRematch) {
      sysLine("New round. Place your ships!");
      newGame();
    } else render();
  }

  // ---------- rendering ----------
  function buildGrid(el, onClick, onHover) {
    el.textContent = "";
    for (var i = 0; i < SIZE * SIZE; i++) {
      var b = document.createElement("button");
      b.type = "button";
      b.className = "cell";
      b.dataset.i = i;
      b.setAttribute("aria-label", "Row " + (Math.floor(i / SIZE) + 1) + ", column " + (i % SIZE + 1));
      el.appendChild(b);
    }
    el.addEventListener("click", function (ev) {
      var t = ev.target.closest(".cell");
      if (t) onClick(Number(t.dataset.i));
    });
    if (onHover) {
      el.addEventListener("mouseover", function (ev) {
        var t = ev.target.closest(".cell");
        if (t) onHover(Number(t.dataset.i));
      });
      el.addEventListener("mouseleave", function () { onHover(-1); });
    }
  }

  function render() {
    var placing = g.phase === "placing";
    var nextShip = FLEET[g.ships.length];

    // my grid
    var preview = null, previewOk = false;
    if (placing && !g.meReady && nextShip && g.hover >= 0) {
      preview = shipCells(g.hover, nextShip.len, g.horizontal);
      previewOk = fits(preview);
      if (!preview) preview = [g.hover];
    }
    var myCells = $("myGrid").children;
    for (var i = 0; i < myCells.length; i++) {
      var cls = "cell";
      if (g.incoming[i] === "hit") {
        var sh = g.ships[g.board[i]];
        cls += sh.hits === sh.cells.length ? " sunk" : " hit";
      } else if (g.incoming[i] === "miss") cls += " miss";
      else if (g.board[i] >= 0) cls += " ship";
      if (preview && preview.indexOf(i) >= 0) cls += previewOk ? " preview" : " bad";
      myCells[i].className = cls;
    }
    $("myGrid").className = "grid" + (placing && !g.meReady ? " placing" : "");

    // enemy grid
    var canAim = g.phase === "battle" && g.myTurn && !g.awaiting;
    var enCells = $("enemyGrid").children;
    for (var j = 0; j < enCells.length; j++) {
      var c2 = "cell";
      if (g.enemy[j]) c2 += " " + g.enemy[j];
      else if (g.revealed && g.revealed.indexOf(j) >= 0) c2 += " revealed";
      else c2 += " open";
      enCells[j].className = c2;
      enCells[j].disabled = !canAim || !!g.enemy[j];
    }
    $("enemyGrid").className = "grid" + (canAim ? " aim" : "");
    $("enemyWrap").classList.toggle("hidden", placing);

    // fleets
    var myFleet = $("myFleet"); myFleet.textContent = "";
    FLEET.forEach(function (f, k) {
      var li = document.createElement("li");
      li.textContent = f.name + " (" + f.len + ")";
      var s = g.ships[k];
      if (placing) {
        if (s) li.className = "done";
        else if (k === g.ships.length && !g.meReady) li.className = "current";
      } else if (s && s.hits === s.cells.length) li.className = "done";
      myFleet.appendChild(li);
    });
    var enFleet = $("enemyFleet"); enFleet.textContent = "";
    var li2 = document.createElement("li");
    li2.textContent = "Ships sunk: " + g.enemySunk + " of " + FLEET.length;
    enFleet.appendChild(li2);

    // controls
    $("placeControls").classList.toggle("hidden", !placing);
    $("overControls").classList.toggle("hidden", g.phase !== "over");
    var locked = g.meReady;
    $("rotateBtn").disabled = locked;
    $("shuffleBtn").disabled = locked;
    $("clearBtn").disabled = locked || g.ships.length === 0;
    $("readyBtn").disabled = locked || g.ships.length < FLEET.length;
    $("rotateBtn").textContent = "Rotate (R): " + (g.horizontal ? "across" : "down");
    $("rematchBtn").disabled = g.meRematch;
    $("rematchBtn").textContent = g.meRematch ? "Waiting for them…" : "Play again";

    // status
    var st = $("status"), text, kind = "";
    if (placing) {
      if (g.meReady) { text = "Waiting for the other player to finish placing ships…"; kind = "wait"; }
      else if (nextShip) text = "Place your " + nextShip.name + " (" + nextShip.len + " squares)" + (g.themReady ? ". They are ready!" : "");
      else text = "All ships placed. Press Ready when you are happy" + (g.themReady ? ". They are ready!" : ".");
    } else if (g.phase === "battle") {
      if (g.awaiting) { text = "Shot fired…"; kind = "wait"; }
      else if (g.myTurn) { text = "Your turn. Pick a square in their waters."; kind = "turn"; }
      else { text = "Their turn. Brace yourself…"; kind = "wait"; }
    } else {
      text = g.won ? "🎉 You won! Their whole fleet is sunk." : "💥 You lost. Your whole fleet is sunk.";
      kind = g.won ? "win" : "lose";
    }
    st.textContent = text;
    st.className = "status " + kind;
  }

  // ---------- chat ----------
  function chatLine(text, cls) {
    var d = document.createElement("div");
    d.textContent = text;
    if (cls) d.className = cls;
    var log = $("chatLog");
    log.appendChild(d);
    log.scrollTop = log.scrollHeight;
  }
  function sysLine(text) { chatLine(text, "sys"); }
  function sendChat(text) {
    text = String(text).trim().slice(0, 200);
    if (!text) return;
    send({ t: "chat", text: text });
    chatLine("You: " + text, "me");
  }

  // ---------- wiring ----------
  buildGrid($("myGrid"), function (i) {
    if (g.phase !== "placing" || g.meReady) return;
    var next = FLEET[g.ships.length];
    if (!next) return;
    var cells = shipCells(i, next.len, g.horizontal);
    if (fits(cells)) { placeShip(cells); render(); }
  }, function (i) {
    if (!g || g.phase !== "placing") return;
    g.hover = i; render();
  });
  buildGrid($("enemyGrid"), fire);

  $("createBtn").addEventListener("click", createRoom);
  $("joinBtn").addEventListener("click", joinRoom);
  $("cancelBtn").addEventListener("click", function () { resetLobby(""); });
  $("codeInput").addEventListener("keydown", function (e) { if (e.key === "Enter") joinRoom(); });

  $("rotateBtn").addEventListener("click", function () { g.horizontal = !g.horizontal; render(); });
  $("shuffleBtn").addEventListener("click", function () { shuffleShips(); render(); });
  $("clearBtn").addEventListener("click", function () { clearShips(); render(); });
  $("readyBtn").addEventListener("click", function () {
    if (g.ships.length < FLEET.length || g.meReady) return;
    g.meReady = true;
    send({ t: "ready" });
    maybeStart();
    render();
  });
  $("rematchBtn").addEventListener("click", function () {
    if (g.phase !== "over" || g.meRematch) return;
    g.meRematch = true;
    send({ t: "rematch" });
    maybeRematch();
  });
  document.addEventListener("keydown", function (e) {
    if ((e.key === "r" || e.key === "R") && g && g.phase === "placing" && !g.meReady && e.target.tagName !== "INPUT") {
      g.horizontal = !g.horizontal; render();
    }
  });

  $("chatSend").addEventListener("click", function () { sendChat($("chatInput").value); $("chatInput").value = ""; });
  $("chatInput").addEventListener("keydown", function (e) {
    if (e.key === "Enter") { sendChat($("chatInput").value); $("chatInput").value = ""; }
  });
  EMOJIS.forEach(function (em) {
    var b = document.createElement("button");
    b.type = "button"; b.textContent = em;
    b.setAttribute("aria-label", "Send " + em);
    b.addEventListener("click", function () { sendChat(em); });
    $("emojiRow").appendChild(b);
  });

  // test hook: lets an automated check read the state
  window.__seaBattle = { state: function () { return g; }, net: net };
})();
</script>
</body>
</html>
